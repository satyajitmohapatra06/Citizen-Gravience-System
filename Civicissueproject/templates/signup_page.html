<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="signup_title">CityZen - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <!-- --- NEW: Styles for Flash Messages --- -->
    <style>
        .flash-message {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            border-radius: .25rem;
            opacity: 1;
            transition: opacity 0.5s ease-out;
            position: fixed; /* Keep it visible on top */
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050; /* Ensure it's above other elements */
            min-width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .flash-message.danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        .flash-message.success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .flash-message.fade-out { /* Applied by JS */
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- Decorative background shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Home Button -->
    <a href="/" class="home-btn">
        <span class="home-icon">🏠</span>
        <span data-translate="home_button">Home</span>
    </a>

    <!-- --- NEW: Flash Message Display Area --- -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <!-- --- END NEW SECTION --- -->

    <!-- Main Signup Container -->
    <div class="container">

        <!-- Left Side: Form -->
        <div class="left">
            <h2 data-translate="signup_heading">Create an account</h2>

            <form method="POST" action="/signup">
                <div class="input-group">
                    <label for="name" data-translate="label_fullname">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your Full Name" data-translate-placeholder="placeholder_name" required aria-required="true">
                </div>

                <div class="input-group">
                    <label for="phone" data-translate="label_phone_number">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" data-translate-placeholder="placeholder_phone" required aria-required="true">
                </div>

                <div class="input-group">
                    <label for="password" data-translate="label_password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" data-translate-placeholder="placeholder_password" required aria-required="true">
                </div>

                <button type="submit" class="btn" data-translate="signup_button">Sign up</button>

                <div class="signup">
                    <span data-translate="signup_already_account">Already have an account?</span>
                    <a href="/user_login" data-translate="login_link">Log in</a>
                </div>
            </form>
        </div>

        <!-- Right Side: Illustration -->
        <div class="right">
            <img src="https://cdn-icons-png.flaticon.com/512/4042/4042171.png" alt="Illustration for the user sign up page">
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <!-- --- NEW: Script to hide flash messages after 5 seconds --- -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach((message) => {
                // Wait 5 seconds (5000 milliseconds)
                setTimeout(() => {
                    message.classList.add('fade-out'); // Add class to trigger CSS transition
                    // Remove the element completely after the fade out transition ends
                    setTimeout(() => {
                        message.remove();
                    }, 500); // This duration should match your CSS transition duration
                }, 5000); // 5-second delay before starting fade
            });
        });
    </script>
    <!-- --- END NEW SCRIPT --- -->
</body>

</html>

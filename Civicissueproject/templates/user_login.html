<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="ul_title">CityZen- User Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <!-- Decorative background shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Home Button -->
    <a href="/" class="home-btn">
        <span class="home-icon">🏠</span>
        <span data-translate="home_button">Home</span>
    </a>

    <!-- Main Login Container -->
    <div class="container">

        <!-- Left Side: Form -->
        <div class="left">
            <h2>CityZen<span data-translate="user_tag">(User)</span></h2>

            <form method="POST" action="/user_login">
                <div class="input-group">
                    <label for="phone" data-translate="label_phone_number">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" data-translate-placeholder="placeholder_phone" required aria-required="true">
                </div>

                <div class="input-group">
                    <label for="password" data-translate="label_password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" data-translate-placeholder="placeholder_password" required aria-required="true">
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember" data-translate="label_remember">Remember me</label>
                </div>

                <button type="submit" class="btn" data-translate="login_button">Log in</button>

                <div class="signup">
                    <span data-translate="ul_no_account">Don't have an account?</span>
                    <a href="/signup" data-translate="signup_link">Sign up</a>
                </div>
            </form>
        </div>

        <!-- Right Side: Illustration -->
        <div class="right">
            <img src="https://cdn-icons-png.flaticon.com/512/4042/4042356.png" alt="Illustration of a person for the user login page">
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>

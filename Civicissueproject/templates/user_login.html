<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>civici report - User Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="left">
             <h2>Civic report (User)</h2>

             <form>
                <div class="input-group">
                    <label for="username">Phone No.</label>
                    <input type="username" id="username" placeholder="Enter Username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn">Log in</button>
                <button type="submit" class="btn-outline">Continue with Email</button>

                <div class="signup">
                    Don't have an account?<a href="#">Sign up</a>
                </div>
             </form>
        </div>
        <div class="right">
            <img src="https://horizontechconnect.eu/wp-content/uploads/2024/11/TechConnect-image-10.png">
        </div>
    </div>
</body>
</html>

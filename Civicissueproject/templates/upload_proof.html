<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="upload_title">Upload Proof</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
    <style>
        .summary-card {
            background: #f9f9f9;
            border-left: 5px solid #170b85;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            text-align: left; /* Ensure content inside is left-aligned */
        }

        .summary-card h4 {
            margin-top: 0;
            color: #170b85;
        }

        .summary-card p {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <!-- Decorative Background Shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <!-- Home Button -->
    <a href="/" class="home-btn">
        <span class="home-icon">🏠</span> <span data-translate="home_button">Home</span>
    </a>

    <main>
        <div class="container fade-in-up">
            <!-- Page Heading -->
            <h2>
                <span data-translate="upload_heading1">Upload Proof for</span>
                <span>Ticket #{{ complaint[0] }}</span>
            </h2>

            <!-- Complaint Summary Card -->
            <div class="summary-card">
                <h4 data-translate="upload_summary_title">Complaint Summary</h4>
                <p><strong>Department:</strong> {{ complaint[10] }}</p>
                <p><strong>Details:</strong> {{ complaint[11] }}</p>
                <p><strong>Location:</strong> {{ complaint[7] }}, {{ complaint[4] }}</p>
            </div>

            <!-- Upload Form -->
            <form method="POST" enctype="multipart/form-data" class="form-card">
                <div class="input-group">
                    <label for="proof" data-translate="label_attach_proof">Attach Proof (Image/Video):</label>
                    <input type="file" id="proof" name="proof" accept="image/*,video/*" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn" data-translate="upload_finish_button">Upload and Finish</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Page Footer -->
    <footer>
        <p data-translate="report_footer">© 2025 CityZen | Designed with ❤️ for better governance</p>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Civic Report — Landing</title>
  <style>
    :root{
      --cyan:#33c3d6;
      --teal:#6fd3cb;
      --nav-blue:#2b87e8;
      --muted:#f5f3ef;
      --text:#0f1720;
      --accent:#d98a1b;
      --container-width:1100px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{height:100%;margin:0;color:var(--text);background:linear-gradient(180deg,#ffffff 0%, #fbfbfb 100%)}

    .topbar{height:34px;background:var(--cyan);}
    .frame{max-width:var(--container-width);margin:20px auto;border:1px solid #ddd;background:white;box-shadow:0 8px 24px rgba(0,0,0,0.06)}

    header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid #e6e6e6}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e9eef0,#dfeef3);box-shadow:inset 0 -2px 0 rgba(0,0,0,0.03)}
    .logo svg{width:22px;height:22px;display:block}
    .brand h1{font-size:20px;margin:0;font-weight:600}

    nav{display:flex;align-items:center;gap:20px}
    nav a{color:#2b2b2b;text-decoration:none;opacity:0.8}
    .login-btn{background:linear-gradient(180deg,#4b90f0,#2b72d6);color:white;padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600}

    .hero{display:flex;align-items:stretch;gap:40px;padding:56px 60px;min-height:420px}
    .left{flex:0 0 46%;display:flex;align-items:center}
    .left .copy{max-width:380px}
    .left h2{margin:0 0 10px;font-size:34px}
    .left h2 b{font-weight:800}
    .left p{margin:0;color:#222;line-height:1.35;font-size:18px}

    .right{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
    .art{width:420px;height:320px;background-image:url('https://horizontechconnect.eu/wp-content/uploads/2024/11/TechConnect-image-10.png');background-size:contain;background-repeat:no-repeat;background-position:center right;opacity:0.95}

    .bottombar{height:34px;background:var(--teal);border-top:1px solid rgba(0,0,0,0.03)}

    @media (max-width:980px){
      .frame{margin:8px}
      .hero{flex-direction:column;padding:28px}
      .left{order:2}
      .right{order:1}
      .left .copy{max-width:100%}
      .art{width:80%;height:220px;background-position:center}
    }
  </style>
</head>
<body>
  <div class="topbar"></div>

  <div class="frame">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="rgb(50,50,50)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19c3-3 7-8 9-10-1.5-1-5 1-9 5-4-4-7.5-6-9-5 2 2 6 7 9 10z" />
            <circle cx="6" cy="6" r="1.2" />
          </svg>
        </div>
        <h1>Civic Report</h1>
      </div>

      <nav>
        <a href="#">Home</a>
        <a href="#">Report</a>
        <a href="#">About</a>
        <button class="login-btn">Login</button>
      </nav>
    </header>

    <section class="hero">
      <div class="left">
        <div class="copy">
          <h2><b>Citizens</b> can report civic<br>issues, upload photos, and</h2>
          <p>track resolutions for better public services...</p>
        </div>
      </div>

      <div class="right">
        <div class="art" role="img" aria-label="abstract building illustration"></div>
      </div>
    </section>

    <div class="bottombar"></div>
  </div>

</body>
</html>

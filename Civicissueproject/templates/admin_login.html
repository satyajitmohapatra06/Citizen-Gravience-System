<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="al_title">CityZen - Admin Login</title>
    <link rel="icon" href="{{ url_for('static', filename='images/app-icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>
        .flash-message {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            border-radius: .25rem;
            opacity: 1;
            transition: opacity 0.5s ease-out;
            position: fixed;
            /* Keep it visible */
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            /* Ensure it's above other elements */
            min-width: 300px;
            /* Give it some width */
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .flash-message.danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .flash-message.success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .flash-message.warning {
            color: #856404;
            background-color: #fff3cd;
            border-color: #ffeeba;
        }

        .flash-message.info {
            color: #0c5460;
            background-color: #d1ecf1;
            border-color: #bee5eb;
        }

        .flash-message.fade-out {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <a href="/" class="home-btn">
        <span class="home-icon">🏠</span>
        <span data-translate="home_button">Home</span>
    </a>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-message {{ category }}" role="alert">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <div class="container">

        <div class="left">
            <h2>CityZen<span data-translate="admin_tag">(Admin)</span></h2>

            <form method="POST" action="/admin_login">
                <div class="input-group">
                    <label for="email" data-translate="label_email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email"
                        data-translate-placeholder="placeholder_email" required aria-required="true">
                </div>

                <div class="input-group">
                    <label for="password" data-translate="label_password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        data-translate-placeholder="placeholder_password" required aria-required="true">
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember" data-translate="label_remember">Remember me</label>
                </div>

                <button type="submit" class="btn" data-translate="login_button">Log in</button>

                <div class="information" data-translate="al_info">
                    🎯 All the ADMIN credentials are already provided to the government officials.
                </div>
            </form>
        </div>

        <div class="right">
            <img src="{{ url_for('static', filename='images/adminlogin.png') }}"
                alt="Illustration of a secure admin dashboard">
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/translate.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach((message) => {
                // Wait 5 seconds (5000 milliseconds)
                setTimeout(() => {
                    message.style.opacity = '0'; // Start fade out
                    // Optional: Remove the element completely after fade out
                    setTimeout(() => {
                        message.remove();
                    }, 800); // Wait for fade out transition (0.5s)
                }, 1000);
            });
        });
    </script>
</body>

</html>

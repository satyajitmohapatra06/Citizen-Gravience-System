<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Certificate - CityZen</title>
    <link rel="icon" href="{{ url_for('static', filename='images/app-icon.png') }}" type="image/png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Dancing+Script:wght@700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .certificate-container {
            width: 840px;
            height: 594px;
            background: white;
            padding: 40px 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 10px solid #002d62;
            box-sizing: border-box;
        }
        
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            font-size: 2.5rem;
            color: #002d62;
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 5px;
        }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-grow: 1;
        }
        
        .illustration-section {
            width: 220px;
            height: 180px;
        }

        .illustration-section svg {
            width: 100%;
            height: 100%;
        }

        .text-section {
            text-align: left;
            max-width: 420px;
        }
        .congratulations {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #1e293b;
        }
        .username {
            font-weight: 700;
        }
        .message {
            margin-top: 15px;
            color: #334155;
            line-height: 1.6;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .footer-logo {
            font-weight: 600;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* ✅ ADDED: Styling for the new inline SVG icon */
        .footer-logo .svg-icon {
            width: 0.8em;
            height: 1em;
            vertical-align: -0.125em;
            fill: currentColor;
        }
        .date-issued {
            background-color: #002d62;
            color: white;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            clip-path: polygon(10% 0%, 100% 0%, 100% 100%, 10% 100%, 0% 50%);
        }

        .download-buttons { margin-top: 2rem; display: flex; gap: 1rem; }
        .btn-download {
            padding: 10px 20px; border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; background-color: #002d62;
            color: white; transition: all 0.2s ease;
        }
        .btn-download:hover { background-color: #3b82f6; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="certificate" class="certificate-container">
        <div class="header">
            <h1>WELCOME TO CITYZEN</h1>
            <p>A Citizen's Civic Network</p>
        </div>

        <div class="main-content">
            <div class="illustration-section">
                <svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#eef2f5;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="220" height="180" rx="15" fill="url(#skyGradient)" />
                    <g opacity="0.8">
                        <rect x="20" y="90" width="40" height="70" rx="3" fill="#64748b" />
                        <rect x="70" y="70" width="35" height="90" rx="3" fill="#a5b4fc" />
                        <rect x="115" y="100" width="40" height="60" rx="3" fill="#64748b" />
                        <rect x="165" y="80" width="35" height="80" rx="3" fill="#a5b4fc" />
                    </g>
                    <g transform="translate(100, 30)">
                        <path d="M10 0 C4.48 0 0 4.48 0 10 C0 18 10 30 10 30 S20 18 20 10 C20 4.48 15.52 0 10 0 Z" fill="#3b82f6"/>
                        <circle cx="10" cy="10" r="3" fill="white"/>
                    </g>
                    <g transform="translate(160, 50) scale(0.7)">
                        <path d="M10 0 C4.48 0 0 4.48 0 10 C0 18 10 30 10 30 S20 18 20 10 C20 4.48 15.52 0 10 0 Z" fill="#002d62" opacity="0.6"/>
                    </g>
                </svg>
            </div>

            <div class="text-section">
                <p class="congratulations">Congratulations, <span class="username">{{ username }}!</span></p>
                <p class="message">You are now an official member of the CityZen community! Thank you for joining us in building a better city, one report at a time.</p>
            </div>
        </div>

        <div class="footer">
            <div class="footer-logo">
                <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                    <path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/>
                </svg>
                CityZen: Your City, Your Voice
            </div>
            <div id="date-issued-element" class="date-issued">Date Issued: </div>
        </div>
    </div>

    <div class="download-buttons">
        <button id="downloadPng" class="btn-download">Download as PNG</button>
        <button id="downloadPdf" class="btn-download">Download as PDF</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateElement = document.getElementById('date-issued-element');
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = today.toLocaleDateString('en-US', options);
            dateElement.textContent = `Date Issued: ${formattedDate}`;
        });

        document.getElementById('downloadPng').addEventListener('click', function() {
            const certificate = document.getElementById('certificate');
            html2canvas(certificate, { useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'CityZen_Welcome_Certificate.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });

        document.getElementById('downloadPdf').addEventListener('click', function() {
            const certificate = document.getElementById('certificate');
            html2canvas(certificate, { useCORS: true, backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
                const { jsPDF } = window.jspdf;
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [certificate.offsetWidth, certificate.offsetHeight]
                });
                pdf.addImage(imgData, 'PNG', 0, 0, certificate.offsetWidth, certificate.offsetHeight);
                pdf.save('CityZen_Welcome_Certificate.pdf');
            });
        });
    </script>
</body>
</html>
